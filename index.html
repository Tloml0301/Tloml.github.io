<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳动爱心</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            background-color: #000000;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            overflow:hidden;
        }
        canvas{
            max-width:100%;
            height:auto;
        }
    </style>
</head>
<body>
<canvas id="heartCanvas"></canvas>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

// 设置画布大小
const W = 640;
const H = 480;
canvas.width = W;
canvas.height = H;
const cx = W / 2;
const cy = H / 2;

let points = new Set();
let edgePoints = new Set();
let insidePoints = new Set();
let allParticles = [];

// 爱心公式
function heartFunc(t, scale){
    let x = 16 * Math.pow(Math.sin(t),3);
    let y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    x *= scale;
    y *= scale;
    return {x:x+cx, y:y+cy};
}

function shrinkPt(x,y){
    let dx = x - cx;
    let dy = y - cy;
    let r2 = dx*dx + dy*dy;
    let k = -800 / r2;
    return {x:x - k*dx, y: y - k*dy};
}

function scatter(x,y,beta){
    let r1 = -beta * Math.log(Math.random());
    let r2 = -beta * Math.log(Math.random());
    return {x: x - r1*(x-cx), y: y - r2*(y-cy)};
}

// 构建爱心点集
function buildHeart(){
    points.clear();
    edgePoints.clear();
    insidePoints.clear();
    const scale = 11;
    for(let i=0;i<2000;i++){
        let t = Math.random() * Math.PI * 2;
        let p = heartFunc(t, scale);
        let ps = shrinkPt(p.x,p.y);
        points.add(`${Math.floor(ps.x)},${Math.floor(ps.y)}`);
    }
    for(let s of points){
        let [px,py] = s.split(',').map(Number);
        for(let k=0;k<3;k++){
            let sp = scatter(px,py,0.05);
            edgePoints.add(`${sp.x},${sp.y}`);
        }
    }
    let ptArr = Array.from(points).map(s=>{let[a,b]=s.split(',');return {x:+a,y:+b};});
    for(let i=0;i<4000;i++){
        let pick = ptArr[Math.floor(Math.random()*ptArr.length)];
        let sp = scatter(pick.x,pick.y,0.15);
        insidePoints.add(`${sp.x},${sp.y}`);
    }
}

buildHeart();
let frame = 0;

// 动画循环
function animate(){
    ctx.fillStyle="#000000";
    ctx.fillRect(0,0,W,H);
    frame += 1;
    let ratio = 800 * Math.sin(frame /10 * Math.PI);

    //光晕粒子
    let haloRadius = 4 + 6*(1+Math.sin(frame/10*Math.PI));
    let haloCount = Math.floor(3000 + 4000 * Math.pow(Math.abs(Math.sin(frame/10*Math.PI)),2));
    for(let i=0;i<haloCount;i++){
        let t = Math.random()*Math.PI*2;
        let p = heartFunc(t,11.6);
        let ps = shrinkPt(p.x,p.y,haloRadius);
        let x = ps.x + (Math.random()*28-14);
        let y = ps.y + (Math.random()*28-14);
        let sz = Math.random()>0.5 ? 2:1;
        ctx.fillStyle="#ff7171";
        ctx.fillRect(x,y,sz,sz);
    }

    //爱心本体点
    function drawSet(set, sizeMin, sizeMax){
        for(let s of set){
            let [x,y] = s.split(',').map(Number);
            let dx = x-cx;
            let dy = y-cy;
            let r2 = dx*dx+dy*dy;
            let moveX = ratio / r2 * dx + (Math.random()>0.5?1:-1);
            let moveY = ratio / r2 * dy + (Math.random()>0.5?1:-1);
            let nx = x - moveX;
            let ny = y - moveY;
            let sz = Math.floor(Math.random()*(sizeMax-sizeMin))+sizeMin;
            ctx.fillStyle="#ff7171";
            ctx.fillRect(nx,ny,sz,sz);
        }
    }
    drawSet(points,1,3);
    drawSet(edgePoints,1,2);
    drawSet(insidePoints,1,2);

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
